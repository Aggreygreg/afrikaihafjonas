{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
        
        <div class="h-64 bg-gray-200"></div>

        <div class="p-6 md:p-8">
            <h1 class="text-3xl font-bold text-gray-900">{{ service.title }}</h1>
            
            <p class="text-2xl text-blue-600 font-bold mt-2">
                {{ service.base_price|floatformat:0 }} Ft
            </p>
            
            <p class="text-gray-500 mt-2">
                Duration: {{ service.duration_minutes }} minutes
            </p>

            <div class="mt-6">
                <h2 class="text-xl font-semibold text-gray-800">Service Description</h2>
                <p class="text-gray-700 mt-2">
                    {{ service.description|linebreaks }}
                </p>
            </div>

            <div class="mt-8">
                <a href="#" class="w-full text-center bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition duration-300">
                    Book This Service
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
