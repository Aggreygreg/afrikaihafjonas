{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <h1 class="text-3xl font-bold text-center text-gray-800 my-8">Our Services</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for service in services %}
            <a href="{% url 'services:service_detail' pk=service.pk %}" class="block bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition">
                <div class="h-48 bg-gray-200"></div>
                <div class="p-6">
                    <h3 class="text-xl font-bold text-gray-800">{{ service.title }}</h3>
                    <p class="text-gray-600 mt-2">Starting at {{ service.base_price|floatformat:0 }} Ft</p>
                </div>
            </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
