{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="bg-gray-50 min-h-screen">
    
    <!-- Unified form that tracks and handles search + sidebar states globally -->
    <form id="filter-form" 
          hx-get="{% url 'services:service_list' %}" 
          hx-target="#services-wrapper" 
          hx-swap="outerHTML"
          class="w-full">
        
        <!-- Top Search & Category section -->
        <div class="bg-white border-b border-gray-100 py-10 shadow-sm">
            <div class="container mx-auto px-6 max-w-7xl">
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight text-center md:text-left mb-6">{% trans "Explore Braid Styles" %}</h1>
                
                <!-- Hidden input tracking the selected parent category (by ID, never name) -->
                <input type="hidden" name="cat" id="cat-input" value="{{ active_parent_pk }}">

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                    
                    <!-- Category Switch Tab Group (admin-driven: one tab per ParentCategory, creation order) -->
                    {% if parent_categories %}
                    <div class="flex items-center gap-2 p-1.5 bg-gray-100 rounded-xl w-fit self-center md:self-auto">
                        {% for parent in parent_categories %}
                        <button type="button" 
                                data-cat-tab="{{ parent.pk }}"
                                onclick="switchCategory('{{ parent.pk }}')"
                                class="px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300 {% if parent.pk == active_parent_pk %}bg-gray-900 text-white shadow-md scale-[1.02]{% else %}text-gray-600 hover:bg-gray-50 hover:text-gray-900{% endif %}">
                            {{ parent.name }}
                        </button>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <!-- Search Input Box -->
                    <div class="relative w-full md:max-w-md">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </span>
                        <input type="search" name="q" value="{{ search_query }}" 
                               placeholder="{% trans 'Search for cornrows, pop smoke, twists...' %}" 
                               hx-get="{% url 'services:service_list' %}"
                               hx-trigger="keyup changed delay:400ms, search"
                               hx-target="#services-wrapper"
                               hx-swap="outerHTML"
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition duration-150">
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Section (Results & Sidebar wrapper) -->
        <div class="container mx-auto px-6 py-12 max-w-7xl">
            {% include "services/partials/service_grid.html" %}
        </div>
    </form>
</div>

<!-- HTMX runtime (the base template does not bundle it) -->
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

<!-- Scripts to manage Mobile Toggles and Category State Updates -->
<script>
    function toggleFilters() {
        const filterContent = document.getElementById('filter-content');
        const chevron = document.getElementById('filter-chevron');
        if (filterContent) {
            filterContent.classList.toggle('hidden');
        }
        if (chevron) {
            chevron.classList.toggle('rotate-180');
        }
    }

    function switchCategory(pk) {
        const catInput = document.getElementById('cat-input');
        if (!catInput || String(catInput.value) === String(pk)) {
            return;
        }
        catInput.value = pk;

        // Instantly clear subcategory selection to prevent category mismatches
        // across parent trees (sidebar options only belong to the active parent)
        const categorySelect = document.getElementById('category');
        if (categorySelect) {
            categorySelect.value = "";
        }

        // Tabs live OUTSIDE the HTMX-swapped wrapper, so the server-rendered
        // active classes cannot update on swap — sync the highlight here.
        document.querySelectorAll('[data-cat-tab]').forEach(function (btn) {
            const isActive = btn.getAttribute('data-cat-tab') === String(pk);
            btn.classList.toggle('bg-gray-900', isActive);
            btn.classList.toggle('text-white', isActive);
            btn.classList.toggle('shadow-md', isActive);
            btn.classList.toggle('scale-[1.02]', isActive);
            btn.classList.toggle('text-gray-600', !isActive);
        });

        // Instantly submit the unified form via HTMX to load matching styles and sync subcategories
        htmx.trigger('#filter-form', 'submit');
    }
</script>
{% endblock %}
