<div>
    <label class="block text-sm font-semibold text-gray-700 mb-3">Available Times</label>
    {% if slots %}
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
            {% for slot in slots %}
                <label class="relative flex items-center justify-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 hover:border-blue-500 transition-all focus-within:ring-2 focus-within:ring-blue-500/20">
                    <input type="radio" name="time_slot" value="{{ slot|time:'H:i' }}" required class="sr-only peer">
                    <!-- Peer styling simulates a beautiful checkbox button toggle -->
                    <span class="absolute inset-0 rounded-xl peer-checked:border-2 peer-checked:border-blue-600 peer-checked:bg-blue-50/30 pointer-events-none"></span>
                    <span class="text-sm font-medium text-gray-700 peer-checked:text-blue-700">{{ slot|time:"H:i" }}</span>
                </label>
            {% endfor %}
        </div>
    {% else %}
        <div class="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-sm flex items-start gap-3">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <div>
                <p class="font-semibold">No appointment slots found.</p>
                <p class="text-xs mt-0.5">The stylist may be fully booked or off-duty on this date. Try another date or stylist.</p>
            </div>
        </div>
    {% endif %}
</div>
